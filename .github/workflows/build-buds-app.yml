name: Build BudsAutoSwitch APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'BudsAutoSwitch/**'
      - '.github/workflows/build-buds-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        working-directory: BudsAutoSwitch
        run: gradle wrapper --gradle-version 8.14.3

      - name: Build debug APK
        working-directory: BudsAutoSwitch
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudsAutoSwitch-debug
          path: BudsAutoSwitch/app/build/outputs/apk/debug/*.apk
